<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スライドエディター</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #0f0f1a;
  color: #e8e8e8;
  height: 100vh;
  overflow: hidden;
}

/* ===== アップロード画面 ===== */
#upload-screen {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0f0f1a;
  z-index: 10000;
}
.upload-area {
  width: 420px;
  height: 260px;
  border: 2px dashed rgba(255,255,255,0.25);
  border-radius: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.3s;
}
.upload-area:hover, .upload-area.dragover {
  border-color: #1b6b2f;
  background: rgba(27,107,47,0.05);
}
.upload-icon { font-size: 52px; margin-bottom: 16px; }
.upload-text { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.upload-sub { font-size: 13px; color: rgba(255,255,255,0.45); }
#file-input { display: none; }

/* ===== ヘッダー ===== */
.header {
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: #16213e;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  height: 52px;
  gap: 16px;
}
.header-title {
  font-size: 15px;
  font-weight: 800;
  color: #fff;
  white-space: nowrap;
}
.header-title .accent { color: #1b6b2f; }
.slide-counter {
  font-size: 13px;
  color: rgba(255,255,255,0.55);
}

/* ===== ズーム表示 ===== */
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: 8px;
}
.zoom-controls .btn {
  padding: 4px 8px;
  font-size: 14px;
  min-width: 28px;
}
.zoom-level {
  font-size: 11px;
  color: rgba(255,255,255,0.55);
  min-width: 36px;
  text-align: center;
}

/* ===== 挿入メニュー ===== */
.insert-menu-wrap {
  position: relative;
}
.insert-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  padding: 4px 0;
  z-index: 99999;
  min-width: 140px;
  display: none;
}
.insert-dropdown.open { display: block; }
.insert-item {
  padding: 7px 14px;
  font-size: 12px;
  cursor: pointer;
  color: #333;
  display: flex;
  align-items: center;
  gap: 6px;
}
.insert-item:hover { background: #f0f4ff; }

.header-spacer { margin-left: auto; }
.last-updated {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  white-space: nowrap;
}
.view-link {
  font-size: 11px;
  color: #4fc3f7;
  text-decoration: none;
  white-space: nowrap;
}
.view-link:hover { text-decoration: underline; }
.header-actions { display: flex; gap: 8px; margin-left: 16px; }
.btn {
  padding: 7px 16px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary { background: #1b6b2f; color: #fff; }
.btn-primary:hover:not(:disabled) { background: #228b3b; }
.btn-ghost {
  background: rgba(255,255,255,0.1);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.25);
}
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.2); }
.btn-pdf { background: #1565c0; color: #fff; border: none; }
.btn-pdf:hover { background: #1976d2; }
.btn-present { background: #6a1b9a; color: #fff; border: none; }
.btn-present:hover { background: #7b1fa2; }
.btn-insert { background: #0d47a1; color: #fff; border: none; }
.btn-insert:hover { background: #1565c0; }

/* ===== メインレイアウト ===== */
.main {
  display: flex;
  height: calc(100vh - 52px);
}

/* ===== サイドバー ===== */
.sidebar {
  width: 72px;
  background: #16213e;
  border-right: 1px solid rgba(255,255,255,0.06);
  overflow-y: auto;
  padding: 8px 0;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,0.15) transparent;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.slide-thumb {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  height: 34px;
  margin: 2px auto;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  color: rgba(255,255,255,0.4);
  cursor: pointer;
  transition: all 0.15s;
  position: relative;
}
.slide-thumb:hover {
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
}
.slide-thumb.active {
  background: #1b6b2f;
  color: #fff;
  font-weight: 700;
}
.slide-thumb.section::after {
  content: '';
  position: absolute;
  right: 4px; top: 4px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #4caf50;
}
.slide-thumb.cta::after {
  content: '';
  position: absolute;
  right: 4px; top: 4px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #cc2222;
}

/* ===== プレビューエリア ===== */
.preview-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  position: relative;
  overflow: hidden;
}
.preview-container { position: relative; }
#preview-iframe {
  border: none;
  display: block;
}

/* ===== 編集パネル ===== */
.edit-panel {
  width: 400px;
  background: #fafafa;
  border-left: 1px solid #e0e0e0;
  overflow-y: auto;
  padding: 20px;
  color: #333;
}
.edit-panel::-webkit-scrollbar { width: 6px; }
.edit-panel::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
.edit-panel h2 {
  font-size: 14px;
  font-weight: 800;
  color: #222;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.slide-type-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
}
.badge-normal  { background: #e8f5e9; color: #1b6b2f; }
.badge-section { background: #1b6b2f; color: #fff; }
.badge-cta     { background: #cc2222; color: #fff; }
.edit-hint {
  font-size: 10px;
  color: #999;
  margin-bottom: 16px;
  line-height: 1.7;
  padding: 8px 10px;
  background: #f0f0f0;
  border-radius: 6px;
}
.edit-hint code {
  background: #e0e0e0;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 10px;
}
.edit-group {
  margin-bottom: 14px;
  padding-bottom: 14px;
  border-bottom: 1px solid #eee;
}
.edit-group:last-child { border-bottom: none; }
.edit-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}
.edit-label-text {
  font-size: 11px;
  font-weight: 700;
  color: #888;
  letter-spacing: 0.03em;
}
.font-size-ctrl {
  display: flex;
  align-items: center;
  gap: 3px;
}
.font-size-ctrl label {
  font-size: 10px;
  color: #aaa;
}
.font-size-input {
  width: 48px;
  padding: 3px 4px;
  border: 1px solid #ddd;
  border-radius: 4px;
  font-size: 11px;
  text-align: center;
  font-family: inherit;
  background: #fff;
}
.font-size-input:focus {
  outline: none;
  border-color: #1b6b2f;
}
.edit-textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 12.5px;
  font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
  line-height: 1.6;
  resize: vertical;
  min-height: 32px;
  background: #fff;
  transition: border-color 0.2s;
}
.edit-textarea:focus {
  outline: none;
  border-color: #1b6b2f;
  box-shadow: 0 0 0 3px rgba(27,107,47,0.08);
}
.no-edit-msg {
  color: #aaa;
  font-size: 13px;
  text-align: center;
  padding: 40px 20px;
}

/* ===== アップデート関連 ===== */
.btn-update { background: #e67e22; color: #fff; }
.btn-update:hover { background: #f39c12; }
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: #1b6b2f;
  color: #fff;
  padding: 12px 28px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  z-index: 99999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s, transform 0.3s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}
.auto-load-banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 8px 20px;
  background: #1a3a5c;
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.auto-load-banner .btn { padding: 4px 12px; font-size: 11px; }

/* ===== 画像挿入 ===== */
.img-add-section {
  margin-bottom: 16px;
  padding: 12px;
  background: #f0f4f8;
  border-radius: 8px;
}
.img-add-section .edit-label-text { margin-bottom: 6px; display: block; }
.img-shape-btns {
  display: flex;
  gap: 6px;
}
.img-shape-btn {
  flex: 1;
  padding: 8px 4px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: #fff;
  cursor: pointer;
  font-size: 10px;
  font-weight: 600;
  font-family: inherit;
  text-align: center;
  color: #555;
  transition: all 0.15s;
}
.img-shape-btn:hover {
  border-color: #1b6b2f;
  color: #1b6b2f;
  background: #e8f5e9;
}
.img-shape-btn .shape-icon {
  font-size: 20px;
  display: block;
  margin-bottom: 2px;
}

/* ===== サイドバーD&D並べ替え ===== */
.slide-thumb[draggable="true"] { cursor: grab; }
.slide-thumb.dragging { opacity: 0.3; }
.slide-thumb.drag-over-top { box-shadow: 0 -2px 0 0 #1b6b2f inset; }
.slide-thumb.drag-over-bottom { box-shadow: 0 2px 0 0 #1b6b2f inset; }

/* ===== スライド操作ボタン ===== */
.slide-actions {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
}
.btn-slide-action {
  padding: 5px 12px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  border: none;
  transition: background 0.2s;
}
.btn-copy-slide {
  background: #e3f2fd;
  color: #1565c0;
}
.btn-copy-slide:hover { background: #bbdefb; }
.btn-delete-slide {
  background: #fce4ec;
  color: #c62828;
}
.btn-delete-slide:hover { background: #ffcdd2; }

/* ===== テキスト編集ツールバー（右パネル内） ===== */
.edit-toolbar {
  display: flex;
  gap: 4px;
  margin-bottom: 4px;
}
.tb-btn {
  padding: 3px 8px;
  border-radius: 3px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid #ddd;
  background: #fff;
  font-family: inherit;
  transition: background 0.15s;
  line-height: 1;
}
.tb-green { color: #1b6b2f; border-color: #a5d6a7; }
.tb-green:hover { background: #e8f5e9; }
.tb-red { color: #cc2222; border-color: #ef9a9a; }
.tb-red:hover { background: #fce4ec; }
.tb-clear { color: #888; }
.tb-clear:hover { background: #f5f5f5; }
.tb-br { color: #1565c0; border-color: #90caf9; }
.tb-br:hover { background: #e3f2fd; }

/* ===== 右クリックコンテキストメニュー ===== */
.ctx-menu {
  position: fixed;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  padding: 4px 0;
  z-index: 99999;
  min-width: 160px;
  display: none;
}
.ctx-menu.open { display: block; }
.ctx-item {
  padding: 7px 14px;
  font-size: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  color: #333;
}
.ctx-item:hover { background: #f0f4ff; }
.ctx-item.disabled { color: #bbb; pointer-events: none; }
.ctx-divider { height: 1px; background: #eee; margin: 3px 0; }

/* ===== フォーマットツールバー（ダブルクリック時） ===== */
#format-toolbar {
  position: fixed;
  background: #1e1b4b;
  border-radius: 6px;
  padding: 4px;
  display: none;
  gap: 2px;
  z-index: 99998;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
}
#format-toolbar.open { display: flex; }
#format-toolbar button {
  background: transparent;
  border: none;
  color: #fff;
  width: 28px;
  height: 28px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
}
#format-toolbar button:hover { background: rgba(255,255,255,0.15); }
#format-toolbar button.mic-active { background: #dc2626; animation: mic-pulse 1s infinite; }
@keyframes mic-pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
.fmt-divider { width: 1px; background: rgba(255,255,255,0.2); margin: 0 2px; }

/* ===== 選択要素プロパティ（右パネル） ===== */
.sel-props-section {
  margin-bottom: 16px;
  padding: 12px;
  background: #eef2ff;
  border-radius: 8px;
  border: 1px solid #c7d2fe;
}
.sel-props-section .edit-label-text { margin-bottom: 8px; display: block; color: #4338ca; }
.sel-prop-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.sel-prop-row label {
  font-size: 10px;
  font-weight: 600;
  color: #666;
  min-width: 60px;
}
.sel-prop-row input[type="color"] {
  width: 28px;
  height: 28px;
  border: 1px solid #ccc;
  border-radius: 4px;
  cursor: pointer;
  padding: 0;
  background: none;
}
.sel-prop-row input[type="range"] {
  flex: 1;
}
.sel-prop-row .range-val {
  font-size: 10px;
  color: #888;
  min-width: 30px;
  text-align: right;
}
</style>
</head>
<body>

<!-- ===== アップロード画面 ===== -->
<div id="upload-screen">
  <div style="text-align:center;margin-bottom:40px;">
    <div style="font-size:42px;font-weight:900;letter-spacing:-0.03em;color:#fff;line-height:1.1;">
      <span style="color:#1b6b2f;">HTML</span> Slide Editor
    </div>
    <div style="font-size:13px;color:rgba(255,255,255,0.35);margin-top:8px;letter-spacing:0.1em;">EDIT · ARRANGE · PRESENT</div>
  </div>
  <div class="upload-area" id="upload-area">
    <div class="upload-icon">📑</div>
    <div class="upload-text">スライドHTMLをドロップ</div>
    <div class="upload-sub">またはクリックしてファイルを選択</div>
  </div>
  <input type="file" id="file-input" accept=".html,.htm">
</div>

<!-- ===== エディター画面 ===== -->
<div id="editor-screen" style="display:none">
  <div class="header">
    <div class="header-title"><span class="accent">▶</span> スライドエディター</div>
    <div class="slide-counter" id="slide-counter">— / —</div>

    <!-- ズームコントロール -->
    <div class="zoom-controls">
      <button class="btn btn-ghost" id="zoom-out-btn" title="縮小">−</button>
      <span class="zoom-level" id="zoom-level">100%</span>
      <button class="btn btn-ghost" id="zoom-in-btn" title="拡大">+</button>
    </div>

    <!-- 元に戻す・やり直し -->
    <button class="btn btn-ghost" id="undo-btn" disabled title="元に戻す (Ctrl+Z)">↩</button>
    <button class="btn btn-ghost" id="redo-btn" disabled title="やり直し (Ctrl+Y)">↪</button>

    <!-- 挿入メニュー -->
    <div class="insert-menu-wrap" id="insert-menu-wrap">
      <button class="btn btn-insert" id="insert-btn">挿入 ▾</button>
      <div class="insert-dropdown" id="insert-dropdown">
        <div class="insert-item" data-type="text">📝 テキスト</div>
        <div class="insert-item" data-type="image">🖼️ 画像</div>
        <div class="insert-item" data-type="button">🔘 ボタン</div>
        <div class="insert-item" data-type="hr">── 区切り線</div>
        <div style="height:1px;background:#eee;margin:4px 0;"></div>
        <div class="insert-item" data-type="delete-slidenums">🗑️ スライド番号を一括削除</div>
      </div>
    </div>

    <span class="header-spacer"></span>
    <span class="last-updated" id="last-updated"></span>
    <a class="view-link" id="view-link" href="view.html" target="_blank" style="display:none">スライドショーを開く →</a>
    <div class="header-actions">
      <button class="btn btn-ghost" id="reload-btn">別のファイル</button>
      <button class="btn btn-update" id="update-btn">アップデート</button>
      <button class="btn btn-primary" id="download-btn">保存・ダウンロード</button>
      <button class="btn btn-pdf" id="pdf-btn">PDF出力</button>
      <a class="btn btn-present" href="presenter.html" target="_blank" style="text-decoration:none">発表モード</a>
    </div>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="preview-area" id="preview-area">
      <div class="preview-container" id="preview-container">
        <iframe id="preview-iframe"></iframe>
      </div>
    </div>
    <div class="edit-panel" id="edit-panel">
      <div class="no-edit-msg">HTMLファイルを読み込んでください</div>
    </div>
  </div>
</div>

<!-- ===== フォーマットツールバー（ダブルクリック時に表示） ===== -->
<div id="format-toolbar">
  <button onclick="execFmt('bold')" title="太字"><b>B</b></button>
  <button onclick="execFmt('italic')" title="斜体"><i>I</i></button>
  <button onclick="execFmt('underline')" title="下線"><u>U</u></button>
  <span class="fmt-divider"></span>
  <button onclick="execAlign('left')" title="左揃え">⫷</button>
  <button onclick="execAlign('center')" title="中央揃え">☰</button>
  <button onclick="execAlign('right')" title="右揃え">⫸</button>
  <span class="fmt-divider"></span>
  <button id="mic-btn" onclick="toggleMic()" title="音声入力">🎤</button>
</div>

<!-- ===== 右クリックコンテキストメニュー ===== -->
<div class="ctx-menu" id="ctx-menu">
  <div class="ctx-item" data-action="copy">📋 コピー</div>
  <div class="ctx-item" data-action="duplicate">📄 複製</div>
  <div class="ctx-item" data-action="delete">🗑️ 削除</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" data-action="front">⬆ 前面へ</div>
  <div class="ctx-item" data-action="back">⬇ 背面へ</div>
  <div class="ctx-divider"></div>
  <div class="ctx-item" data-action="lock">🔒 ロック</div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="img-file-input" accept="image/*" style="display:none">
<input type="file" id="insert-img-file-input" accept="image/*" style="display:none">

<script>
/* ===== ステート管理 ===== */
let currentSlide = 0;
let totalSlides = 0;
let iframeDoc = null;

/* ===== ズーム関連ステート ===== */
let zoomLevel = 100;
const ZOOM_MIN = 50;
const ZOOM_MAX = 200;
const ZOOM_STEP = 10;

/* ===== Undo/Redo ステート ===== */
const undoStack = [];
const redoStack = [];
const MAX_UNDO = 30;

/* ===== 選択要素ステート ===== */
let selectedElement = null;
let isTextEditing = false;

/* ===== 編集対象テキスト要素の定義 ===== */
const EDITABLE = [
  { sel: '.eyebrow',       label: 'カテゴリ' },
  { sel: '.main-title',    label: 'メインタイトル' },
  { sel: '.sub-title',     label: 'サブタイトル' },
  { sel: '.section-title', label: 'セクションタイトル' },
  { sel: '.chapter-num',   label: '章番号' },
  { sel: '.key-msg',       label: 'キーメッセージ' },
  { sel: '.key-sub',       label: '補足テキスト' },
  { sel: '.list-heading',  label: 'リスト見出し' },

/* ===== アップロード処理 ===== */
const uploadScreen  = document.getElementById('upload-screen');
const uploadArea    = document.getElementById('upload-area');
const fileInput     = document.getElementById('file-input');
const editorScreen  = document.getElementById('editor-screen');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) loadFile(fileInput.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => initEditor(e.target.result);
  reader.readAsText(file);
}

/* ===== インライン編集・選択対象セレクタ ===== */
const INLINE_SELS = '.eyebrow,.main-title,.sub-title,.section-title,.chapter-num,.key-msg,.key-sub,.list-heading,.list-item,.list-footer,.profile-name,.profile-title,.profile-bio,.ba-label,.ba-text,.ba-arrow,.step-text,.step-footer,.col-icon,.col-title,.col-desc,.work-title,.work-text,.work-note,.cta-title,.cta-sub,.slide-num';
const DRAG_THRESHOLD = 5;

/* ===== エディター初期化 ===== */

    '#nav-bar,#fullscreen-btn,#progress-bar{display:none!important}' +
    '.slide{transform:none!important}' +
    '.content>*,.list-area>*,.ba-wrap>*,.step-list>*,.cols>*,.slide-num{transition:outline 0.12s}' +
    '.content>*:hover,.list-area>*:hover,.ba-wrap>*:hover,.step-list>*:hover,.cols>*:hover,.slide-num:hover{outline:1px dashed rgba(27,107,47,0.4);cursor:grab}' +

    '.inserted-img .img-delete{position:absolute;top:-8px;right:-8px;width:16px;height:16px;background:#cc2222;color:#fff;border:1px solid #fff;border-radius:50%;font-size:10px;line-height:14px;text-align:center;cursor:pointer;z-index:16;display:none}' +

    '.sel-nw{top:-4px;left:-4px;cursor:nwse-resize}' +
    '.sel-n{top:-4px;left:50%;margin-left:-4px;cursor:ns-resize}' +
    '.sel-ne{top:-4px;right:-4px;cursor:nesw-resize}' +
    '.sel-e{top:50%;right:-4px;margin-top:-4px;cursor:ew-resize}' +
    '.sel-se{bottom:-4px;right:-4px;cursor:nwse-resize}' +
    '.sel-s{bottom:-4px;left:50%;margin-left:-4px;cursor:ns-resize}' +
    '.sel-sw{bottom:-4px;left:-4px;cursor:nesw-resize}' +

/* ===== 選択オーバーレイ作成（iframe内に注入） ===== */
function createSelectionOverlay() {
  if (!iframeDoc) return;
  let overlay = iframeDoc.getElementById('__sel-overlay__');
  if (!overlay) {
    overlay = iframeDoc.createElement('div');
    overlay.id = '__sel-overlay__';
    overlay.innerHTML =
      '<div class="sel-handle sel-nw" data-dir="nw"></div>' +
      '<div class="sel-handle sel-n" data-dir="n"></div>' +
      '<div class="sel-handle sel-ne" data-dir="ne"></div>' +
      '<div class="sel-handle sel-e" data-dir="e"></div>' +
      '<div class="sel-handle sel-se" data-dir="se"></div>' +
      '<div class="sel-handle sel-s" data-dir="s"></div>' +
      '<div class="sel-handle sel-sw" data-dir="sw"></div>' +
      '<div class="sel-handle sel-w" data-dir="w"></div>';
    iframeDoc.body.appendChild(overlay);
  }
  return overlay;
}

/* ===== 選択オーバーレイの位置更新 ===== */
function updateSelectionOverlay() {
  if (!iframeDoc) return;
  const overlay = iframeDoc.getElementById('__sel-overlay__');
  if (!overlay) return;

  if (!selectedElement || isTextEditing) {
    overlay.classList.remove('active');
    return;
  }

  /* 選択中の要素の位置・サイズを取得 */
  const el = selectedElement;
  const slidePage = iframeDoc.querySelectorAll('.slide-page')[currentSlide];
  if (!slidePage) return;
  const slideEl = slidePage.querySelector('.slide');
  if (!slideEl) return;

  /* slideEl内での相対位置を計算 */
  const slideRect = slideEl.getBoundingClientRect();
  const elRect = el.getBoundingClientRect();

  overlay.style.left   = (elRect.left - slideRect.left) + 'px';
  overlay.style.top    = (elRect.top - slideRect.top) + 'px';
  overlay.style.width  = elRect.width + 'px';
  overlay.style.height = elRect.height + 'px';

  /* オーバーレイをslideEl内に配置 */
  if (overlay.parentElement !== slideEl) {
    slideEl.appendChild(overlay);
  }

  overlay.classList.add('active');
}

/* ===== サイドバー構築（D&D並べ替え対応） ===== */
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';
  let dragSrcIdx = null;

  iframeDoc.querySelectorAll('.slide-page').forEach((p, i) => {
    const slide = p.querySelector('.slide');
    const thumb = document.createElement('div');
    let cls = 'slide-thumb';
    if (slide && slide.classList.contains('section-slide')) cls += ' section';
    if (slide && slide.classList.contains('cta-slide'))     cls += ' cta';
    if (i === currentSlide) cls += ' active';
    thumb.className   = cls;
    thumb.textContent  = String(i + 1).padStart(2, '0');
    thumb.draggable    = true;
    thumb.dataset.idx  = i;

    thumb.addEventListener('click', () => goToSlide(i));

    /* ドラッグ開始 */
    thumb.addEventListener('dragstart', (e) => {
      dragSrcIdx = i;
      thumb.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });

    /* ドラッグオーバー */
    thumb.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = thumb.getBoundingClientRect();
      const mid  = rect.top + rect.height / 2;
      thumb.classList.remove('drag-over-top', 'drag-over-bottom');
      thumb.classList.add(e.clientY < mid ? 'drag-over-top' : 'drag-over-bottom');
    });

    thumb.addEventListener('dragleave', () => {
      thumb.classList.remove('drag-over-top', 'drag-over-bottom');
    });

    /* ドロップ */
    thumb.addEventListener('drop', (e) => {
      e.preventDefault();
      thumb.classList.remove('drag-over-top', 'drag-over-bottom');
      const dropIdx = parseInt(thumb.dataset.idx);
      if (dragSrcIdx === null || dragSrcIdx === dropIdx) return;

      /* iframe内の.slide-pageを並べ替え */
      const pages    = Array.from(iframeDoc.querySelectorAll('.slide-page'));
      const srcPage  = pages[dragSrcIdx];
      const rect     = thumb.getBoundingClientRect();
      const insertBefore = e.clientY < rect.top + rect.height / 2;
      const refPage  = pages[dropIdx];

      if (insertBefore) {
        refPage.parentNode.insertBefore(srcPage, refPage);
      } else {
        refPage.parentNode.insertBefore(srcPage, refPage.nextSibling);
      }

      reindexSlides();
      buildSidebar();

      /* 移動後のスライドに遷移 */
      const newPages = iframeDoc.querySelectorAll('.slide-page');
      let newIdx = 0;
      newPages.forEach((pg, idx) => { if (pg === srcPage) newIdx = idx; });
      goToSlide(newIdx);
      saveUndoState();
      showToast('スライドを移動しました');
    });

    thumb.addEventListener('dragend', () => {
      thumb.classList.remove('dragging');
      dragSrcIdx = null;
      sidebar.querySelectorAll('.slide-thumb').forEach(t => {
        t.classList.remove('drag-over-top', 'drag-over-bottom');
      });
    });

    sidebar.appendChild(thumb);
  });
}

/* ===== プレビュースケーリング ===== */
function scalePreview() {
  const area      = document.getElementById('preview-area');
  const container = document.getElementById('preview-container');
  const iframe    = document.getElementById('preview-iframe');
  if (!area || !container) return;

  const iframeW = 390;
  const iframeH = Math.round(390 * 9 / 16);
  const baseScale = Math.min(
    (area.clientWidth  - 32) / iframeW,
    (area.clientHeight - 32) / iframeH
  );
  /* ズームレベルを適用 */
  const scale = baseScale * (zoomLevel / 100);
  container.style.width           = iframeW + 'px';
  container.style.height          = iframeH + 'px';
  container.style.transform       = 'scale(' + scale + ')';
  container.style.transformOrigin = 'center center';
  iframe.style.width  = iframeW + 'px';
  iframe.style.height = iframeH + 'px';
}
window.addEventListener('resize', scalePreview);

/* ===== ズームコントロール ===== */
document.getElementById('zoom-in-btn').addEventListener('click', () => setZoom(zoomLevel + ZOOM_STEP));
document.getElementById('zoom-out-btn').addEventListener('click', () => setZoom(zoomLevel - ZOOM_STEP));

function setZoom(level) {
  zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, level));
  document.getElementById('zoom-level').textContent = zoomLevel + '%';
  scalePreview();
}

/* Ctrl+マウスホイールでズーム */
document.getElementById('preview-area').addEventListener('wheel', (e) => {
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    setZoom(zoomLevel + (e.deltaY < 0 ? ZOOM_STEP : -ZOOM_STEP));
  }
}, { passive: false });

/* ===== スライドナビゲーション ===== */
function goToSlide(idx) {
  if (idx < 0 || idx >= totalSlides) return;
  currentSlide = idx;

  /* 選択を解除 */
  deselectElement();
  hideFormatToolbar();

  /* iframe内のスライド表示を切り替え */
  iframeDoc.querySelectorAll('.slide-page').forEach((p, i) => {
    p.classList.toggle('active', i === idx);
  });

  /* サイドバーのハイライト更新 */
  document.querySelectorAll('.slide-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  const active = document.querySelector('.slide-thumb.active');
  if (active) active.scrollIntoView({ block: 'nearest' });

  /* カウンター更新 */
  document.getElementById('slide-counter').textContent = (idx + 1) + ' / ' + totalSlides;

  /* 編集パネル構築 */
  buildEditPanel(idx);
}

/* ===== 編集パネル構築 ===== */
function buildEditPanel(idx) {
  const panel    = document.getElementById('edit-panel');
  const slideEl  = iframeDoc.querySelectorAll('.slide-page')[idx].querySelector('.slide');
  const iframeWin = document.getElementById('preview-iframe').contentWindow;

  /* スライドタイプ判定 */
  let type = '通常', badge = 'badge-normal';
  if (slideEl.classList.contains('section-slide')) { type = 'セクション'; badge = 'badge-section'; }
  if (slideEl.classList.contains('cta-slide'))     { type = 'CTA';        badge = 'badge-cta'; }

  let html = '<h2>Slide ' + (idx + 1) +
    ' <span class="slide-type-badge ' + badge + '">' + type + '</span></h2>';
  html += '<div class="slide-actions">' +
    '<button class="btn-slide-action btn-copy-slide" id="copy-slide-btn">+ コピー</button>' +
    '<button class="btn-slide-action btn-delete-slide" id="delete-slide-btn">削除</button>' +
    '</div>';

  /* 画像挿入ボタン */
  html += '<div class="img-add-section">' +
    '<span class="edit-label-text">画像を追加</span>' +
    '<div class="img-shape-btns">' +
    '<button class="img-shape-btn" onclick="addImageToSlide(\'rect\')"><span class="shape-icon">▬</span>長方形</button>' +
    '<button class="img-shape-btn" onclick="addImageToSlide(\'square\')"><span class="shape-icon">■</span>正方形</button>' +
    '<button class="img-shape-btn" onclick="addImageToSlide(\'circle\')"><span class="shape-icon">●</span>丸型</button>' +
    '</div></div>';

  /* 選択要素プロパティ（背景色・角丸） */
  html += '<div class="sel-props-section" id="sel-props-section" style="display:none;">' +
    '<span class="edit-label-text">選択要素のプロパティ</span>' +
    '<div class="sel-prop-row">' +
    '<label>背景色</label>' +
    '<input type="color" id="sel-bg-color" value="#000000">' +
    '<button class="tb-btn tb-clear" id="sel-bg-clear" style="font-size:9px;padding:2px 6px;">リセット</button>' +
    '</div>' +
    '<div class="sel-prop-row">' +
    '<label>角丸</label>' +
    '<input type="range" id="sel-border-radius" min="0" max="50" value="0">' +
    '<span class="range-val" id="sel-br-val">0px</span>' +
    '</div>' +
    '</div>';

  const elementMap = [];
  let eidx = 0;

  EDITABLE.forEach(cfg => {
    /* 対象セレクタに合致する要素を検索（.content内を優先、なければslide直下） */
    const els = slideEl.querySelectorAll(cfg.sel);
    if (!els.length) return;

    els.forEach((el, i) => {
      const id    = 'e' + eidx;
      const label = (cfg.multi && els.length > 1) ? cfg.label + ' ' + (i + 1) : cfg.label;
      const fs    = Math.round(parseFloat(iframeWin.getComputedStyle(el).fontSize) || 14);
      const content = el.innerHTML;
      const rows  = Math.max(1, Math.min((content.match(/<br\s*\/?>/gi) || []).length + 2, 8));

      html += '<div class="edit-group">';
      html += '<div class="edit-label">';
      html += '<span class="edit-label-text">' + label + '</span>';
      html += '<div class="font-size-ctrl">';
      html += '<label>サイズ</label>';
      html += '<input type="number" class="font-size-input" id="s' + id + '" value="' + fs + '" min="4" max="200" data-idx="' + eidx + '">';
      html += '<label>px</label>';
      html += '</div></div>';
      html += '<div class="edit-toolbar">' +
        '<button class="tb-btn tb-green" data-ta="' + id + '" data-action="green">緑色</button>' +
        '<button class="tb-btn tb-red" data-ta="' + id + '" data-action="red">赤色</button>' +
        '<button class="tb-btn tb-clear" data-ta="' + id + '" data-action="clear">色解除</button>' +
        '<button class="tb-btn tb-br" data-ta="' + id + '" data-action="br">改行↵</button>' +
        '</div>';
      html += '<textarea class="edit-textarea" id="' + id + '" rows="' + rows + '" data-idx="' + eidx + '">' + esc(content) + '</textarea>';
      html += '</div>';

      elementMap.push(el);
      eidx++;
    });
  });

  if (eidx === 0) {
    html += '<div class="no-edit-msg">編集可能なテキストがありません</div>';
  }

  panel.innerHTML = html;
  panel.scrollTop = 0;

  /* イベントリスナー接続 */
  panel.querySelectorAll('.edit-textarea').forEach(ta => {
    const el = elementMap[parseInt(ta.dataset.idx)];
    if (!el) return;
    /* テキスト入力でリアルタイム反映 */
    ta.addEventListener('input', () => { el.innerHTML = ta.value; });
    /* フォーカス時にプレビュー内の要素をハイライト */
    ta.addEventListener('focus', () => {
      el.style.outline = '3px solid #ff6600';
      el.style.outlineOffset = '2px';
    });
    ta.addEventListener('blur', () => {
      el.style.outline = '';
      el.style.outlineOffset = '';
      saveUndoState();
    });
  });

  panel.querySelectorAll('.font-size-input').forEach(inp => {
    const el = elementMap[parseInt(inp.dataset.idx)];
    if (!el) return;
    inp.addEventListener('input', () => {
      el.style.fontSize = inp.value + 'px';
    });
    inp.addEventListener('change', () => { saveUndoState(); });
  });

  /* ツールバーボタンのイベント */
  panel.querySelectorAll('.tb-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ta = document.getElementById(btn.dataset.ta);
      if (!ta) return;
      const action = btn.dataset.action;
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const val = ta.value;

      if (action === 'br') {
        /* カーソル位置に改行タグを挿入 */
        ta.value = val.substring(0, start) + '<br/>' + val.substring(start);
        ta.selectionStart = ta.selectionEnd = start + 5;
      } else if (action === 'clear') {
        /* 選択範囲内のspanタグを除去 */
        if (start === end) return;
        const sel = val.substring(start, end);
        const cleaned = sel.replace(/<span class="[gr]">/g, '').replace(/<\/span>/g, '');
        ta.value = val.substring(0, start) + cleaned + val.substring(end);
        ta.selectionStart = start;
        ta.selectionEnd = start + cleaned.length;
      } else {
        /* 選択範囲をspan.g or span.r で囲む */
        if (start === end) return;
        const cls = action === 'green' ? 'g' : 'r';
        const sel = val.substring(start, end);
        const wrapped = '<span class="' + cls + '">' + sel + '</span>';
        ta.value = val.substring(0, start) + wrapped + val.substring(end);
        ta.selectionStart = start;
        ta.selectionEnd = start + wrapped.length;
      }
      ta.dispatchEvent(new Event('input'));
      ta.focus();
    });
  });

  /* 選択要素プロパティのイベント接続 */
  setupSelPropsListeners();

  /* スライドコピー・削除ボタン */
  const copyBtn = document.getElementById('copy-slide-btn');
  if (copyBtn) copyBtn.addEventListener('click', copyCurrentSlide);
  const delBtn = document.getElementById('delete-slide-btn');
  if (delBtn) delBtn.addEventListener('click', deleteCurrentSlide);

  /* 選択要素プロパティを更新 */
  updateSelPropsPanel();
}

/* ===== 選択要素プロパティパネルの表示/非表示・値更新 ===== */
function updateSelPropsPanel() {
  const section = document.getElementById('sel-props-section');
  if (!section) return;

  if (!selectedElement) {
    section.style.display = 'none';
    return;
  }

  section.style.display = '';
  const bgInput = document.getElementById('sel-bg-color');
  const brInput = document.getElementById('sel-border-radius');
  const brVal   = document.getElementById('sel-br-val');

  /* 現在の背景色を取得 */
  const computed = document.getElementById('preview-iframe').contentWindow.getComputedStyle(selectedElement);
  const bgColor = selectedElement.style.backgroundColor || '';
  if (bgColor) {
    /* rgb → hex 変換 */
    bgInput.value = rgbToHex(bgColor);
  } else {
    bgInput.value = '#000000';
  }

  /* 現在の角丸を取得 */
  const br = parseInt(selectedElement.style.borderRadius) || 0;
  brInput.value = br;
  brVal.textContent = br + 'px';
}

/* 選択要素プロパティのイベントリスナー */
function setupSelPropsListeners() {
  const bgInput = document.getElementById('sel-bg-color');
  const bgClear = document.getElementById('sel-bg-clear');
  const brInput = document.getElementById('sel-border-radius');
  const brVal   = document.getElementById('sel-br-val');
  if (!bgInput) return;

  bgInput.addEventListener('input', () => {
    if (!selectedElement) return;
    selectedElement.style.backgroundColor = bgInput.value;
  });
  bgInput.addEventListener('change', () => { saveUndoState(); });

  bgClear.addEventListener('click', () => {
    if (!selectedElement) return;
    selectedElement.style.backgroundColor = '';
    saveUndoState();
  });

  brInput.addEventListener('input', () => {
    if (!selectedElement) return;
    selectedElement.style.borderRadius = brInput.value + 'px';
    brVal.textContent = brInput.value + 'px';
  });
  brInput.addEventListener('change', () => { saveUndoState(); });
}

/* RGB文字列→16進変換ユーティリティ */
function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/(\d+)/g);
  if (!m || m.length < 3) return '#000000';
  return '#' + m.slice(0, 3).map(c => parseInt(c).toString(16).padStart(2, '0')).join('');
}

/* HTML特殊文字エスケープ */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

/* ===== スライドコピー ===== */
function copyCurrentSlide() {
  if (!iframeDoc) return;
  const pages = iframeDoc.querySelectorAll('.slide-page');
  const current = pages[currentSlide];

  /* 現在のスライドを複製 */
  const clone = current.cloneNode(true);
  clone.classList.remove('active');
  current.after(clone);

  /* 全スライドの data-index と slide-num を振り直す */
  reindexSlides();
  buildSidebar();
  goToSlide(currentSlide + 1);
  saveUndoState();
  showToast('スライド ' + (currentSlide + 1) + ' をコピーしました');
}

/* ===== スライド削除 ===== */
function deleteCurrentSlide() {
  if (!iframeDoc || totalSlides <= 1) return;
  if (!confirm('スライド ' + (currentSlide + 1) + ' を削除しますか？')) return;

  const pages = iframeDoc.querySelectorAll('.slide-page');
  pages[currentSlide].remove();

  reindexSlides();
  buildSidebar();
  goToSlide(Math.min(currentSlide, totalSlides - 1));
  saveUndoState();
  showToast('スライドを削除しました');
}

/* スライド番号の振り直し */
function reindexSlides() {
  const allPages = iframeDoc.querySelectorAll('.slide-page');
  totalSlides = allPages.length;
  allPages.forEach((p, i) => {
    p.setAttribute('data-index', i);
    const num = p.querySelector('.slide-num');
    if (num) num.textContent = String(i + 1).padStart(2, '0');
  });
}

/* ===== 統合インタラクション（クリック=選択 / ダブルクリック=編集 / ドラッグ=移動） ===== */
function setupInlineEditing() {
  if (!iframeDoc) return;

  let downTarget = null, downX = 0, downY = 0, origTX = 0, origTY = 0;
  let dragging = false;
  /* 画像リサイズ用ステート */
  let resizing = false, resizeTarget = null, resizeStartW = 0, resizeStartH = 0, resizeStartX = 0, resizeStartY = 0;
  /* 選択オーバーレイリサイズ用ステート */
  let handleResizing = false, handleDir = '', handleStartX = 0, handleStartY = 0;
  let handleOrigW = 0, handleOrigH = 0, handleOrigL = 0, handleOrigT = 0;
  let handleIsImg = false;

  /* === マウスダウン === */
  iframeDoc.addEventListener('mousedown', (e) => {
    e.stopPropagation();

    /* リサイズハンドル（選択オーバーレイの8点ハンドル） */
    if (e.target.classList.contains('sel-handle')) {
      if (!selectedElement || selectedElement.dataset.locked === 'true') return;
      handleResizing = true;
      handleDir = e.target.dataset.dir;
      handleStartX = e.clientX;
      handleStartY = e.clientY;
      handleIsImg = selectedElement.tagName === 'IMG' || selectedElement.classList.contains('inserted-img');
      const rect = selectedElement.getBoundingClientRect();
      handleOrigW = rect.width;
      handleOrigH = rect.height;
      /* left/top の現在値を取得 */
      handleOrigL = parseInt(selectedElement.style.left) || 0;
      handleOrigT = parseInt(selectedElement.style.top) || 0;
      /* transform translate ベースの場合 */
      if (!selectedElement.classList.contains('inserted-img') &&
          !selectedElement.classList.contains('inserted-text-block') &&
          !selectedElement.classList.contains('inserted-cta-btn') &&
          !selectedElement.classList.contains('inserted-hr')) {
        const t = selectedElement.style.transform || '';
        const m = t.match(/translate\(\s*([^,]+)px\s*,\s*([^)]+)px\s*\)/);
        handleOrigL = m ? parseFloat(m[1]) : 0;
        handleOrigT = m ? parseFloat(m[2]) : 0;
      }
      e.preventDefault();
      return;
    }

    /* 画像リサイズハンドル（既存互換） */
    if (e.target.classList.contains('img-resize')) {
      resizing = true;
      resizeTarget = e.target.parentElement;
      resizeStartW = resizeTarget.offsetWidth;
      resizeStartH = resizeTarget.offsetHeight;
      resizeStartX = e.clientX;
      resizeStartY = e.clientY;
      e.preventDefault();
      return;
    }

    /* 削除ボタン（挿入画像のXボタン） */
    if (e.target.classList.contains('img-delete')) {
      e.target.parentElement.remove();
      deselectElement();
      buildEditPanel(currentSlide);
      saveUndoState();
      return;
    }

    /* テキスト編集中に同じ要素内をクリック → カーソル移動を許可 */
    if (isTextEditing) {
      const editingEl = iframeDoc.querySelector('[contenteditable="true"]');
      if (editingEl && editingEl.contains(e.target)) {
        /* preventDefaultしない → ブラウザの標準カーソル移動が効く */
        return;
      }
    }

    /* ロックされた要素はドラッグ不可 */
    const clickedEl = e.target.closest('[data-locked="true"]');
    if (clickedEl && clickedEl.dataset.locked === 'true') {
      /* ロック要素は選択だけ許可 */
      selectElement(clickedEl);
      e.preventDefault();
      return;
    }

    /* ドラッグ対象を特定 */
    const imgTarget = e.target.closest('.inserted-img');
    const textBlockTarget = e.target.closest('.inserted-text-block');
    const ctaBtnTarget = e.target.closest('.inserted-cta-btn');
    const hrTarget = e.target.closest('.inserted-hr');
    const textTarget = e.target.closest(INLINE_SELS);
    const target = imgTarget || textBlockTarget || ctaBtnTarget || hrTarget || textTarget;

    if (!target) {
      /* 空白クリック → 編集終了・選択解除 */
      finishEditing();
      deselectElement();
      return;
    }

    downTarget = target;
    downX = e.clientX;
    downY = e.clientY;
    dragging = false;

    /* 移動元の位置を取得 */
    if (imgTarget || textBlockTarget || ctaBtnTarget || hrTarget) {
      origTX = parseInt(target.style.left) || 0;
      origTY = parseInt(target.style.top) || 0;
    } else {
      const t = target.style.transform || '';
      const m = t.match(/translate\(\s*([^,]+)px\s*,\s*([^)]+)px\s*\)/);
      origTX = m ? parseFloat(m[1]) : 0;
      origTY = m ? parseFloat(m[2]) : 0;
    }

    e.preventDefault();
  }, true);

  /* === マウスムーブ === */
  iframeDoc.addEventListener('mousemove', (e) => {
    /* 選択オーバーレイハンドルのリサイズ中 */
    if (handleResizing && selectedElement) {
      const dx = e.clientX - handleStartX;
      const dy = e.clientY - handleStartY;
      applyHandleResize(dx, dy);
      updateSelectionOverlay();
      return;
    }

    /* 画像リサイズ中（既存互換） */
    if (resizing && resizeTarget) {
      const dx = e.clientX - resizeStartX;
      const dy = e.clientY - resizeStartY;
      const shape = resizeTarget.dataset.shape;
      if (shape === 'square' || shape === 'circle') {
        const d = Math.max(dx, dy);
        resizeTarget.style.width  = Math.max(20, resizeStartW + d) + 'px';
        resizeTarget.style.height = Math.max(20, resizeStartW + d) + 'px';
      } else {
        resizeTarget.style.width  = Math.max(30, resizeStartW + dx) + 'px';
        resizeTarget.style.height = Math.max(20, resizeStartH + dy) + 'px';
      }
      updateSelectionOverlay();
      return;
    }

    if (!downTarget) return;
    if (downTarget.dataset && downTarget.dataset.locked === 'true') return;
    const dx = e.clientX - downX;
    const dy = e.clientY - downY;

    if (!dragging && (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD)) {
      dragging = true;
      finishEditing();
      downTarget.classList.add('__drag-shadow__');
      downTarget.style.cursor = 'grabbing';
      iframeDoc.body.style.cursor = 'grabbing';
    }

    if (dragging) {
      if (downTarget.classList.contains('inserted-img') ||
          downTarget.classList.contains('inserted-text-block') ||
          downTarget.classList.contains('inserted-cta-btn') ||
          downTarget.classList.contains('inserted-hr')) {
        downTarget.style.left = (origTX + dx) + 'px';
        downTarget.style.top  = (origTY + dy) + 'px';
      } else {
        downTarget.style.transform = 'translate(' + (origTX + dx) + 'px,' + (origTY + dy) + 'px)';
      }
      updateSelectionOverlay();
    }
  });

  /* === マウスアップ === */
  iframeDoc.addEventListener('mouseup', (e) => {
    /* ハンドルリサイズ終了 */
    if (handleResizing) {
      handleResizing = false;
      saveUndoState();
      return;
    }
    /* 画像リサイズ終了 */
    if (resizing) {
      resizing = false;
      resizeTarget = null;
      saveUndoState();
      return;
    }
    if (!downTarget) return;

    if (dragging) {
      downTarget.classList.remove('__drag-shadow__');
      downTarget.style.cursor = '';
      iframeDoc.body.style.cursor = '';
      saveUndoState();
    }

    if (!dragging) {
      /* シングルクリック → 選択 */
      const target = downTarget;
      finishEditing();
      selectElement(target);
    }

    downTarget = null;
    dragging = false;
  });

  /* === ダブルクリック → テキスト編集モード === */
  iframeDoc.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    const textTarget = e.target.closest(INLINE_SELS);
    const insertedText = e.target.closest('.inserted-text-block');
    const insertedCta = e.target.closest('.inserted-cta-btn');
    const target = textTarget || insertedText || insertedCta;

    if (!target) return;
    if (target.dataset && target.dataset.locked === 'true') return;

    /* テキスト編集モード開始 */
    enterTextEditMode(target);
  }, true);

  /* === キーボードイベント === */
  iframeDoc.addEventListener('keydown', (e) => {
    e.stopPropagation();
    const editing = isTextEditing;

    /* Delete / Backspace で選択中の要素を削除（テキスト編集中は除く） */
    if (!editing && selectedElement && (e.key === 'Delete' || e.key === 'Backspace')) {
      if (selectedElement.dataset && selectedElement.dataset.locked === 'true') return;
      e.preventDefault();
      /* 子要素を持つ場合は確認ダイアログ */
      if (selectedElement.children.length > 0 && !selectedElement.classList.contains('inserted-img')) {
        if (!confirm('この要素を削除しますか？（子要素も含まれます）')) return;
      }
      selectedElement.remove();
      deselectElement();
      buildEditPanel(currentSlide);
      saveUndoState();
      return;
    }

    /* 矢印キーでナッジ（テキスト編集中は除く） */
    if (!editing && selectedElement) {
      if (selectedElement.dataset && selectedElement.dataset.locked === 'true') return;
      const step = e.shiftKey ? 10 : 1;
      let handled = false;

      if (selectedElement.classList.contains('inserted-img') ||
          selectedElement.classList.contains('inserted-text-block') ||
          selectedElement.classList.contains('inserted-cta-btn') ||
          selectedElement.classList.contains('inserted-hr')) {
        /* left/top ベースの要素 */
        const curL = parseInt(selectedElement.style.left) || 0;
        const curT = parseInt(selectedElement.style.top) || 0;
        if (e.key === 'ArrowLeft')  { selectedElement.style.left = (curL - step) + 'px'; handled = true; }
        if (e.key === 'ArrowRight') { selectedElement.style.left = (curL + step) + 'px'; handled = true; }
        if (e.key === 'ArrowUp')    { selectedElement.style.top  = (curT - step) + 'px'; handled = true; }
        if (e.key === 'ArrowDown')  { selectedElement.style.top  = (curT + step) + 'px'; handled = true; }
      } else {
        /* transform:translate ベースの要素 */
        const t = selectedElement.style.transform || '';
        const m = t.match(/translate\(\s*([^,]+)px\s*,\s*([^)]+)px\s*\)/);
        let tx = m ? parseFloat(m[1]) : 0;
        let ty = m ? parseFloat(m[2]) : 0;
        if (e.key === 'ArrowLeft')  { tx -= step; handled = true; }
        if (e.key === 'ArrowRight') { tx += step; handled = true; }
        if (e.key === 'ArrowUp')    { ty -= step; handled = true; }
        if (e.key === 'ArrowDown')  { ty += step; handled = true; }
        if (handled) selectedElement.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
      }

      if (handled) {
        e.preventDefault();
        updateSelectionOverlay();
        return;
      }
    }

    if (e.key === 'Escape') {
      if (editing) { finishEditing(); return; }
      if (selectedElement) { deselectElement(); return; }
    }

    /* スライドナビゲーション（何も選択していない時のみ） */
    if (!editing && !selectedElement) {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goToSlide(currentSlide + 1); }
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goToSlide(currentSlide - 1); }
    }
  }, true);

  /* === 右クリックイベント（コンテキストメニュー） === */
  iframeDoc.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();

    /* クリック対象の要素を特定 */
    const imgTarget = e.target.closest('.inserted-img');
    const textBlockTarget = e.target.closest('.inserted-text-block');
    const ctaBtnTarget = e.target.closest('.inserted-cta-btn');
    const hrTarget = e.target.closest('.inserted-hr');
    const textTarget = e.target.closest(INLINE_SELS);
    const ctxTarget = imgTarget || textBlockTarget || ctaBtnTarget || hrTarget || textTarget;

    if (ctxTarget) {
      selectElement(ctxTarget);
    }

    /* iframeのスケールとオフセットを考慮した座標計算 */
    const iframe = document.getElementById('preview-iframe');
    const iframeRect = iframe.getBoundingClientRect();
    const container = document.getElementById('preview-container');
    const containerRect = container.getBoundingClientRect();
    const scaleX = containerRect.width / parseInt(iframe.style.width);
    const scaleY = containerRect.height / parseInt(iframe.style.height);

    const menuX = iframeRect.left + e.clientX * scaleX;
    const menuY = iframeRect.top + e.clientY * scaleY;

    showContextMenu(menuX, menuY, ctxTarget);
  }, true);

  /* テキスト編集終了処理 */
  function finishEditing() {
    if (isTextEditing) {
      /* 音声入力中なら停止 */
      if (isRecording) stopMic();
      const prev = iframeDoc.querySelector('[contenteditable="true"]');
      if (prev) {
        prev.contentEditable = false;
      }
      isTextEditing = false;
      hideFormatToolbar();
      buildEditPanel(currentSlide);
      saveUndoState();
    }
  }

  /* リサイズハンドルの適用処理 */
  function applyHandleResize(dx, dy) {
    if (!selectedElement) return;
    const el = selectedElement;
    const dir = handleDir;
    let newW = handleOrigW;
    let newH = handleOrigH;

    /* 画像の場合はアスペクト比を維持（コーナーハンドルのみ） */
    const isCorner = ['nw', 'ne', 'se', 'sw'].includes(dir);
    const maintainAspect = (el.tagName === 'IMG' || el.classList.contains('inserted-img')) && isCorner;
    const aspect = handleOrigW / handleOrigH;

    /* 方向に応じたリサイズ計算 */
    if (dir.includes('e')) newW = handleOrigW + dx;
    if (dir.includes('w')) newW = handleOrigW - dx;
    if (dir.includes('s')) newH = handleOrigH + dy;
    if (dir.includes('n')) newH = handleOrigH - dy;

    if (maintainAspect) {
      if (dir === 'se' || dir === 'ne') {
        newH = newW / aspect;
      } else {
        newW = newH * aspect;
      }
    }

    newW = Math.max(20, newW);
    newH = Math.max(20, newH);

    el.style.width = newW + 'px';
    el.style.height = newH + 'px';

    /* 左・上方向リサイズ時は位置も移動 */
    if (el.classList.contains('inserted-img') ||
        el.classList.contains('inserted-text-block') ||
        el.classList.contains('inserted-cta-btn') ||
        el.classList.contains('inserted-hr')) {
      if (dir.includes('w')) el.style.left = (handleOrigL + dx) + 'px';
      if (dir.includes('n')) el.style.top = (handleOrigT + dy) + 'px';
    }
  }
}

/* ===== 要素選択 ===== */
function selectElement(el) {
  if (!el) return;
  /* 前の選択を解除 */
  if (selectedElement && selectedElement !== el) {
    selectedElement.classList.remove('__sel-active__');
    if (selectedElement.classList.contains('inserted-img')) {
      selectedElement.classList.remove('selected');
    }
  }

  selectedElement = el;
  el.classList.add('__sel-active__');
  if (el.classList.contains('inserted-img')) {
    el.classList.add('selected');
  }

  updateSelectionOverlay();
  updateSelPropsPanel();

  /* iframeにフォーカスを当てる（キーイベント受信のため） */
  document.getElementById('preview-iframe').contentWindow.focus();
}

/* ===== 要素選択解除 ===== */
function deselectElement() {
  if (selectedElement) {
    selectedElement.classList.remove('__sel-active__');
    if (selectedElement.classList.contains('inserted-img')) {
      selectedElement.classList.remove('selected');
    }
    selectedElement = null;
  }
  /* 全体のselectedクラスもクリーン */
  if (iframeDoc) {
    iframeDoc.querySelectorAll('.inserted-img.selected').forEach(el => el.classList.remove('selected'));
    iframeDoc.querySelectorAll('.__sel-active__').forEach(el => el.classList.remove('__sel-active__'));
  }
  /* オーバーレイを非表示 */
  const overlay = iframeDoc ? iframeDoc.getElementById('__sel-overlay__') : null;
  if (overlay) overlay.classList.remove('active');

  updateSelPropsPanel();
  hideFormatToolbar();
}

/* ===== テキスト編集モード開始 ===== */
function enterTextEditMode(target) {
  if (!target) return;
  isTextEditing = true;
  target.contentEditable = true;
  target.focus();

  /* 選択オーバーレイを非表示にする（編集中は不要） */
  const overlay = iframeDoc.getElementById('__sel-overlay__');
  if (overlay) overlay.classList.remove('active');

  /* フォーマットツールバーを表示 */
  showFormatToolbar(target);
}

/* ===== フォーマットツールバー表示 ===== */
function showFormatToolbar(target) {
  const toolbar = document.getElementById('format-toolbar');
  if (!toolbar || !target) return;

  /* 対象要素のiframe内位置を親ドキュメント座標に変換 */
  const iframe = document.getElementById('preview-iframe');
  const iframeRect = iframe.getBoundingClientRect();
  const container = document.getElementById('preview-container');
  const containerRect = container.getBoundingClientRect();
  const scaleX = containerRect.width / parseInt(iframe.style.width);
  const scaleY = containerRect.height / parseInt(iframe.style.height);

  const elRect = target.getBoundingClientRect();
  const x = iframeRect.left + elRect.left * scaleX;
  const y = iframeRect.top + elRect.top * scaleY;

  toolbar.style.left = Math.max(0, x) + 'px';
  toolbar.style.top = Math.max(0, y - 40) + 'px';
  toolbar.classList.add('open');
}

function hideFormatToolbar() {
  const toolbar = document.getElementById('format-toolbar');
  if (toolbar) toolbar.classList.remove('open');
}

/* ===== フォーマットコマンド実行 ===== */
function execFmt(cmd) {
  if (!iframeDoc || !isTextEditing) return;
  iframeDoc.execCommand(cmd, false, null);
  document.getElementById('preview-iframe').contentWindow.focus();
}
/* グローバルスコープに公開（onclick属性用） */
window.execFmt = execFmt;

function execAlign(align) {
  if (!iframeDoc || !isTextEditing) return;
  const editing = iframeDoc.querySelector('[contenteditable="true"]');
  if (editing) {
    editing.style.textAlign = align;
  }
  document.getElementById('preview-iframe').contentWindow.focus();
}
window.execAlign = execAlign;

/* ===== 音声入力（Web Speech API） ===== */
let recognition = null;
let isRecording = false;

function toggleMic() {
  if (isRecording) {
    stopMic();
  } else {
    startMic();
  }
}
window.toggleMic = toggleMic;

function startMic() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast('このブラウザは音声入力に対応していません');
    return;
  }
  if (!isTextEditing) {
    showToast('テキスト編集モードで使用してください（ダブルクリック）');
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'ja-JP';
  recognition.interimResults = true;
  recognition.continuous = true;

  const micBtn = document.getElementById('mic-btn');
  micBtn.classList.add('mic-active');
  isRecording = true;

  /* 仮テキスト表示用のspan */
  let interimSpan = null;

  recognition.onresult = (event) => {
    const iframeWin = document.getElementById('preview-iframe').contentWindow;
    let finalText = '';
    let interimText = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) {
        finalText += event.results[i][0].transcript;
      } else {
        interimText += event.results[i][0].transcript;
      }
    }

    /* 仮テキストを表示（灰色） */
    if (interimText && !interimSpan) {
      interimSpan = iframeDoc.createElement('span');
      interimSpan.style.cssText = 'color:rgba(100,100,100,0.6);font-style:italic;';
      interimSpan.id = '__mic-interim__';
      const sel = iframeWin.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        range.collapse(false);
        range.insertNode(interimSpan);
      }
    }
    if (interimSpan) {
      interimSpan.textContent = interimText;
    }

    /* 確定テキストをカーソル位置に挿入 */
    if (finalText) {
      if (interimSpan) {
        interimSpan.remove();
        interimSpan = null;
      }
      const sel = iframeWin.getSelection();
      if (sel.rangeCount > 0) {
        const range = sel.getRangeAt(0);
        range.collapse(false);
        const textNode = iframeDoc.createTextNode(finalText);
        range.insertNode(textNode);
        range.setStartAfter(textNode);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }
    }
  };

  recognition.onerror = (event) => {
    console.warn('音声認識エラー:', event.error);
    if (event.error !== 'no-speech') {
      showToast('音声認識エラー: ' + event.error);
    }
    stopMic();
  };

  recognition.onend = () => {
    /* 仮テキストを削除 */
    const interim = iframeDoc.getElementById('__mic-interim__');
    if (interim) interim.remove();

    if (isRecording) {
      /* continuous中に自動停止した場合は再開 */
      try { recognition.start(); } catch(e) { stopMic(); }
    }
  };

  recognition.start();
  showToast('🎤 音声入力開始… マイクに向かって話してください');
}

function stopMic() {
  isRecording = false;
  const micBtn = document.getElementById('mic-btn');
  if (micBtn) micBtn.classList.remove('mic-active');
  if (recognition) {
    recognition.onend = null;
    recognition.abort();
    recognition = null;
  }
  /* 仮テキストを削除 */
  if (iframeDoc) {
    const interim = iframeDoc.getElementById('__mic-interim__');
    if (interim) interim.remove();
  }
  showToast('🎤 音声入力終了');
  saveUndoState();
}

/* ===== 右クリックコンテキストメニュー ===== */
function showContextMenu(x, y, targetEl) {
  const menu = document.getElementById('ctx-menu');

  /* ロック/ロック解除のテキストを切替 */
  const lockItem = menu.querySelector('[data-action="lock"]');
  if (targetEl && targetEl.dataset.locked === 'true') {
    lockItem.textContent = '🔓 ロック解除';
  } else {
    lockItem.textContent = '🔒 ロック';
  }

  /* 対象要素がない場合は一部のメニューをdisabled化 */
  menu.querySelectorAll('.ctx-item').forEach(item => {
    item.classList.toggle('disabled', !targetEl && item.dataset.action !== 'copy');
  });

  /* 画面端で溢れないよう調整 */
  menu.style.left = Math.min(x, window.innerWidth - 180) + 'px';
  menu.style.top  = Math.min(y, window.innerHeight - 250) + 'px';
  menu.classList.add('open');
  menu._targetEl = targetEl;
}

function hideContextMenu() {
  const menu = document.getElementById('ctx-menu');
  menu.classList.remove('open');
  menu._targetEl = null;
}

/* コンテキストメニューアクション */
document.getElementById('ctx-menu').addEventListener('click', (e) => {
  const item = e.target.closest('.ctx-item');
  if (!item || item.classList.contains('disabled')) return;
  const action = item.dataset.action;
  const menu = document.getElementById('ctx-menu');
  const targetEl = menu._targetEl;

  switch (action) {
    case 'copy':
      /* クリップボードにテキストをコピー */
      if (targetEl) {
        navigator.clipboard.writeText(targetEl.textContent || '').then(() => {
          showToast('コピーしました');
        });
      }
      break;
    case 'duplicate':
      if (targetEl) {
        const clone = targetEl.cloneNode(true);
        /* 少しずらして挿入 */
        if (clone.style.left) {
          clone.style.left = (parseInt(clone.style.left) + 10) + 'px';
          clone.style.top  = (parseInt(clone.style.top) + 10) + 'px';
        } else {
          const t = clone.style.transform || '';
          const m = t.match(/translate\(\s*([^,]+)px\s*,\s*([^)]+)px\s*\)/);
          const tx = m ? parseFloat(m[1]) + 10 : 10;
          const ty = m ? parseFloat(m[2]) + 10 : 10;
          clone.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
        }
        targetEl.parentElement.appendChild(clone);
        selectElement(clone);
        saveUndoState();
        showToast('要素を複製しました');
      }
      break;
    case 'delete':
      if (targetEl) {
        if (targetEl.dataset.locked === 'true') {
          showToast('ロックされた要素は削除できません');
          break;
        }
        targetEl.remove();
        deselectElement();
        buildEditPanel(currentSlide);
        saveUndoState();
        showToast('要素を削除しました');
      }
      break;
    case 'front':
      if (targetEl) {
        const parent = targetEl.parentElement;
        parent.appendChild(targetEl);
        saveUndoState();
        showToast('前面に移動しました');
      }
      break;
    case 'back':
      if (targetEl) {
        const parent = targetEl.parentElement;
        parent.insertBefore(targetEl, parent.firstChild);
        saveUndoState();
        showToast('背面に移動しました');
      }
      break;
    case 'lock':
      if (targetEl) {
        if (targetEl.dataset.locked === 'true') {
          delete targetEl.dataset.locked;
          targetEl.classList.remove('__locked__');
          showToast('ロックを解除しました');
        } else {
          targetEl.dataset.locked = 'true';
          targetEl.classList.add('__locked__');
          showToast('要素をロックしました');
        }
        saveUndoState();
      }
      break;
  }
  hideContextMenu();
});

/* ===== Undo/Redo システム ===== */
function saveUndoState() {
  if (!iframeDoc) return;
  /* 選択オーバーレイを一時非表示にしてからスナップショット取得 */
  const overlay = iframeDoc.getElementById('__sel-overlay__');
  let overlayDisplay = '';
  if (overlay) {
    overlayDisplay = overlay.style.display;
    overlay.style.display = 'none';
  }

  const snapshot = iframeDoc.body.innerHTML;

  if (overlay) overlay.style.display = overlayDisplay;

  /* 直前と同じなら保存しない */
  if (undoStack.length > 0 && undoStack[undoStack.length - 1] === snapshot) return;

  undoStack.push(snapshot);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
  /* 新しい操作をしたのでRedoスタックをクリア */
  redoStack.length = 0;
  updateUndoRedoButtons();
}

function performUndo() {
  if (undoStack.length <= 1) return; /* 初期状態は残す */
  const current = undoStack.pop();
  redoStack.push(current);
  const previous = undoStack[undoStack.length - 1];
  restoreState(previous);
  updateUndoRedoButtons();
  showToast('元に戻しました');
}

function performRedo() {
  if (redoStack.length === 0) return;
  const next = redoStack.pop();
  undoStack.push(next);
  restoreState(next);
  updateUndoRedoButtons();
  showToast('やり直しました');
}

function restoreState(snapshot) {
  if (!iframeDoc) return;
  deselectElement();
  isTextEditing = false;
  hideFormatToolbar();
  iframeDoc.body.innerHTML = snapshot;
  /* オーバーレイを再作成 */
  createSelectionOverlay();
  /* スライド数を再計算 */
  totalSlides = iframeDoc.querySelectorAll('.slide-page').length;
  buildSidebar();
  goToSlide(Math.min(currentSlide, totalSlides - 1));
}

function updateUndoRedoButtons() {
  document.getElementById('undo-btn').disabled = (undoStack.length <= 1);
  document.getElementById('redo-btn').disabled = (redoStack.length === 0);
}

/* Undo/Redoボタンのクリックイベント */
document.getElementById('undo-btn').addEventListener('click', performUndo);
document.getElementById('redo-btn').addEventListener('click', performRedo);

/* Ctrl+Z / Ctrl+Y / Ctrl+Shift+Z キーバインド（親ドキュメント） */
document.addEventListener('keydown', (e) => {
  /* テキストエリア・入力フィールド内では無視 */
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

  if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
    e.preventDefault();
    performUndo();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
    e.preventDefault();
    performRedo();
    return;
  }
});

/* ===== PDFエクスポート ===== */
document.getElementById('pdf-btn').addEventListener('click', async () => {
  if (!iframeDoc) return;
  showToast('PDF生成中…');

  /* 全スライドを画像化してPDFにする */
  const pages = iframeDoc.querySelectorAll('.slide-page');
  const total = pages.length;
  const baseW = 390, baseH = Math.round(390 * 9 / 16);

  /* html2canvasをCDNから読み込み */
  if (!window.html2canvas) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    document.head.appendChild(s);
    await new Promise(r => s.onload = r);
  }
  /* jsPDFをCDNから読み込み */
  if (!window.jspdf) {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js';
    document.head.appendChild(s);
    await new Promise(r => s.onload = r);
  }

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [baseW * 2, baseH * 2] });

  const savedSlide = currentSlide;

  for (let i = 0; i < total; i++) {
    pages.forEach((p, j) => p.classList.toggle('active', j === i));

    /* スライド要素をキャプチャ */
    const slideEl = pages[i].querySelector('.slide');
    if (!slideEl) continue;

    try {
      const canvas = await html2canvas(slideEl, {
        width: baseW, height: baseH, scale: 2,
        useCORS: true, allowTaint: true, logging: false
      });

      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, baseW * 2, baseH * 2);
    } catch (err) {
      console.warn('Slide ' + (i+1) + ' capture failed:', err);
    }
  }

  /* 元のスライドに戻す */
  pages.forEach((p, j) => p.classList.toggle('active', j === savedSlide));

  pdf.save('slideshow.pdf');
  showToast('PDF出力完了！');
});

  editorScreen.style.display = 'none';
  uploadScreen.style.display = 'flex';
  fileInput.value = '';
  /* ステートをリセット */
  undoStack.length = 0;
  redoStack.length = 0;
  updateUndoRedoButtons();
  selectedElement = null;
  isTextEditing = false;
  zoomLevel = 100;
  document.getElementById('zoom-level').textContent = '100%';
});

/* ===== キーボードナビゲーション（親ドキュメント） ===== */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  /* Ctrl+Z/Y はUndo/Redoで処理済み */
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'y')) return;

  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); goToSlide(currentSlide + 1); }
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   { e.preventDefault(); goToSlide(currentSlide - 1); }
  if (e.key === 'Home') { e.preventDefault(); goToSlide(0); }
  if (e.key === 'End')  { e.preventDefault(); goToSlide(totalSlides - 1); }
});

/* ===== iframe内のCtrl+Z/Y をキャプチャしてUndo/Redoに転送 ===== */
function setupIframeUndoRedo() {
  if (!iframeDoc) return;
  iframeDoc.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
      e.preventDefault();
      e.stopPropagation();
      performUndo();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
      e.preventDefault();
      e.stopPropagation();
      performRedo();
      return;
    }
  }, true);
}

/* initEditor内のiframe.onloadコールバックを拡張するためのフック */
const _origInitEditor = initEditor;
initEditor = function(html) {
  _origInitEditor(html);
  /* iframe.onloadが非同期なので少し待ってからセットアップ */
  const checkInterval = setInterval(() => {
    if (iframeDoc) {
      setupIframeUndoRedo();
      clearInterval(checkInterval);
    }
  }, 100);
};

/* ===== 起動時にlocalStorageから自動ロード ===== */
(function autoLoad() {
  const saved = localStorage.getItem('slideshow_html');
  if (saved) {
    initEditor(saved);
    showLastUpdated();
  }
})();
</script>
